version: "3"

tasks:
  proto:
    desc: Gera código Protobuf/gRPC (Go e Python)
    cmds: [./scripts/build_protos.sh]

  deps:
    desc: Instala dependências Go e Python
    cmds:
      - go mod download
      - uv sync

  gateway:
    desc: Gateway (Go)
    cmds: [go run ./gateway]

  weather:
    desc: "Estação meteorológica (Java 21; Maven gera o Protobuf). Ex.: task weather SOURCE_ID=estacao-02"
    # Variáveis passadas na linha de comando do Task não chegam ao processo
    # como ambiente; este bloco faz o repasse. Valor vazio cai no padrão.
    env:
      SOURCE_ID: "{{.SOURCE_ID}}"
      FIELD_ID: "{{.FIELD_ID}}"
      INTERVAL_S: "{{.INTERVAL_S}}"
      ADVERTISE_IP: "{{.ADVERTISE_IP}}"
    cmds:
      - mvn -B -f sources/weather/pom.xml package
      - java -jar sources/weather/target/weather-0.1.0.jar

  soil:
    desc: "Sensor de solo (Python). Ex.: task soil SOURCE_ID=solo-b FIELD_ID=talhao-b"
    env:
      SOURCE_ID: "{{.SOURCE_ID}}"
      FIELD_ID: "{{.FIELD_ID}}"
      INTERVAL_S: "{{.INTERVAL_S}}"
      ADVERTISE_IP: "{{.ADVERTISE_IP}}"
    cmds: [uv run python -m sources.soil.main]

  valve:
    desc: "Válvula de irrigação (Python). Ex.: task valve SOURCE_ID=valvula-b FIELD_ID=talhao-b"
    env:
      SOURCE_ID: "{{.SOURCE_ID}}"
      FIELD_ID: "{{.FIELD_ID}}"
      INTERVAL_S: "{{.INTERVAL_S}}"
      ADVERTISE_IP: "{{.ADVERTISE_IP}}"
      GRPC_PORT: "{{.GRPC_PORT}}"
      FLOW_LPM: "{{.FLOW_LPM}}"
    cmds: [uv run python -m sources.valve.main]

  web:build:
    desc: Build estático da interface Next.js (web/out)
    dir: web
    cmds: [npm ci, npm run build]

  web:dev:
    desc: Interface em modo dev (http://localhost:3000), usando a ponte em :8080
    dir: web
    cmds: [npm run dev]

  dashboard:
    desc: Ponte do dashboard + interface (http://localhost:8080); requer task web:build
    cmds: [uv run python -m dashboard.server]

  client:
    desc: "Cliente CLI. Ex.: task client -- list"
    cmds:
      - uv run python -m client.main {{.CLI_ARGS}}

  test:
    desc: Testes Go e Python
    cmds:
      - go test ./...
      - uv run pytest -q

  lint:
    desc: go vet, gofmt e ruff
    cmds:
      - go vet ./...
      # gofmt -l só lista os arquivos; sem o teste a tarefa nunca falharia.
      - 'out=$(gofmt -l .); test -z "$out" || { echo "$out"; exit 1; }'
      - uv run ruff check .
