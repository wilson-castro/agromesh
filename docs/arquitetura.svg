<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" font-family="Nunito, 'Nunito Sans', 'Segoe UI', Arial, sans-serif">
  <defs>
    <style>
      .grp { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: #6b6656; }
      .grps { font-size: 12px; fill: #6b6656; }
      .t { font-size: 15px; font-weight: 700; fill: #232b21; }
      .tl { font-size: 15px; font-weight: 400; fill: #232b21; }
      .d { font-size: 14px; fill: #3d4a3a; }
      .lk { font-size: 13px; font-weight: 700; }
      .mt { font-size: 12px; fill: #6b6656; }
      .gw { font-size: 16px; fill: #f3efe3; }
    </style>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f7a2f"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6a8a"/></marker>
    <marker id="m-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a7650"/></marker>
  </defs>

  <rect width="1280" height="620" fill="#f3efe3"/>

  <!-- Fontes -->
  <text x="60" y="38"><tspan class="grp">FONTES</tspan><tspan class="grps">  ·  um processo por equipamento</tspan></text>

  <rect x="60" y="56" width="300" height="100" rx="12" fill="#e3e9d8" stroke="#6e8f50" stroke-width="1.5"/>
  <text class="t" x="80" y="86">Estação meteorológica <tspan class="tl">(Java 21)</tspan></text>
  <text class="d" x="80" y="112">Mede temperatura, umidade do ar,</text>
  <text class="d" x="80" y="134">vento e chuva</text>

  <rect x="60" y="176" width="300" height="100" rx="12" fill="#e3e9d8" stroke="#6e8f50" stroke-width="1.5"/>
  <text class="t" x="80" y="206">Sensores de solo <tspan class="tl">(Python)</tspan></text>
  <text class="d" x="80" y="232">Medem a umidade da terra e avisam</text>
  <text class="d" x="80" y="254">na hora quando ela seca</text>

  <rect x="60" y="296" width="300" height="100" rx="12" fill="#dbe6ec" stroke="#2f6a8a" stroke-width="1.5"/>
  <text class="t" x="80" y="326">Válvulas de irrigação <tspan class="tl">(Python)</tspan></text>
  <text class="d" x="80" y="352">Abrem, fecham e contam os</text>
  <text class="d" x="80" y="374">litros usados</text>

  <!-- Fontes para o Gateway -->
  <line x1="364" y1="106" x2="534" y2="106" stroke="#4f7a2f" stroke-width="1.6" marker-end="url(#m-green)"/>
  <text class="lk" x="450" y="96" text-anchor="middle" fill="#4f7a2f">UDP · Protobuf</text>
  <text class="mt" x="450" y="124" text-anchor="middle">leitura a cada 3 s</text>

  <line x1="364" y1="226" x2="534" y2="226" stroke="#4f7a2f" stroke-width="1.6" marker-end="url(#m-green)"/>
  <text class="lk" x="450" y="216" text-anchor="middle" fill="#4f7a2f">UDP · Protobuf</text>
  <text class="mt" x="450" y="244" text-anchor="middle">a cada 4 s, alerta na hora</text>

  <line x1="364" y1="320" x2="534" y2="320" stroke="#2f6a8a" stroke-width="1.6" marker-end="url(#m-blue)"/>
  <text class="lk" x="450" y="310" text-anchor="middle" fill="#2f6a8a">UDP · Protobuf</text>
  <text class="mt" x="450" y="339" text-anchor="middle">leitura a cada 2 s</text>
  <line x1="364" y1="352" x2="534" y2="352" stroke="#2f6a8a" stroke-width="1.6" marker-start="url(#m-blue)" marker-end="url(#m-blue)"/>
  <text class="lk" x="450" y="372" text-anchor="middle" fill="#2f6a8a">gRPC · Protobuf</text>
  <text class="mt" x="450" y="388" text-anchor="middle">comando sob pedido, até 3 s</text>

  <!-- Descoberta -->
  <path d="M570,380 V440 H210 V402" fill="none" stroke="#4f7a2f" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#m-green)"/>
  <text class="lk" x="385" y="460" text-anchor="middle" fill="#4f7a2f">UDP multicast · Protobuf</text>
  <text class="mt" x="385" y="477" text-anchor="middle">convite de descoberta a cada 15 s</text>

  <!-- Gateway -->
  <rect x="540" y="76" width="250" height="300" rx="14" fill="#222b20"/>
  <text x="564" y="116" font-size="17" font-weight="700" fill="#f3efe3">Gateway <tspan font-weight="400">(Go)</tspan></text>
  <text class="gw" x="564" y="170">Descobre as fontes</text>
  <text class="gw" x="564" y="204">Recebe as medições</text>
  <text class="gw" x="564" y="238">Guarda o histórico</text>
  <text class="gw" x="564" y="272">Repassa os comandos</text>
  <text class="gw" x="564" y="306">Avisa o painel ao vivo</text>
  <text x="564" y="354" font-size="12" fill="#a9b39c">UDP 9100 · TCP 9200</text>

  <!-- Banco -->
  <line x1="665" y1="380" x2="665" y2="486" stroke="#8a7650" stroke-width="1.6" marker-start="url(#m-brown)" marker-end="url(#m-brown)"/>
  <text class="lk" x="677" y="414" fill="#8a7650">SQL local</text>
  <text class="mt" x="677" y="430">grava a cada leitura</text>

  <rect x="520" y="490" width="290" height="112" rx="12" fill="#fcf9f1" stroke="#8f7d5a" stroke-width="1.5"/>
  <text class="t" x="540" y="518">Banco SQLite</text>
  <text class="d" x="540" y="542"><tspan font-weight="700">readings</tspan> guarda cada métrica</text>
  <text class="d" x="540" y="563"><tspan font-weight="700">alerts</tspan> guarda os alertas de seca</text>
  <text class="d" x="540" y="584">Consultas por janela de tempo</text>

  <!-- Clientes TCP -->
  <rect x="930" y="20" width="300" height="306" rx="14" fill="#ebe5d4"/>
  <text x="946" y="46"><tspan class="grp">CLIENTES TCP</tspan><tspan class="grps">  ·  só falam com o Gateway</tspan></text>

  <rect x="946" y="66" width="268" height="80" rx="10" fill="#fcf9f1" stroke="#8f7d5a" stroke-width="1.5"/>
  <text class="t" x="966" y="96">CLI</text>
  <text class="d" x="966" y="122">Python, no terminal</text>

  <rect x="946" y="196" width="268" height="112" rx="10" fill="#fcf9f1" stroke="#8f7d5a" stroke-width="1.5"/>
  <text class="t" x="966" y="226">Ponte do painel</text>
  <text class="d" x="966" y="252">Python, converte Protobuf</text>
  <text class="d" x="966" y="274">em JSON para o navegador</text>

  <line x1="794" y1="106" x2="942" y2="106" stroke="#8a7650" stroke-width="1.6" marker-start="url(#m-brown)" marker-end="url(#m-brown)"/>
  <text class="lk" x="868" y="96" text-anchor="middle" fill="#8a7650">TCP · Protobuf</text>
  <text class="mt" x="868" y="124" text-anchor="middle">um pedido por vez</text>

  <line x1="794" y1="252" x2="942" y2="252" stroke="#8a7650" stroke-width="1.6" marker-start="url(#m-brown)" marker-end="url(#m-brown)"/>
  <text class="lk" x="868" y="242" text-anchor="middle" fill="#8a7650">TCP · Protobuf</text>
  <text class="mt" x="868" y="270" text-anchor="middle">assinatura ao vivo</text>

  <!-- Navegador -->
  <line x1="1080" y1="312" x2="1080" y2="444" stroke="#8a7650" stroke-width="1.6" marker-start="url(#m-brown)" marker-end="url(#m-brown)"/>
  <text class="lk" x="1092" y="372" fill="#8a7650">HTTP · JSON e SSE</text>
  <text class="mt" x="1092" y="388">eventos ao vivo</text>

  <text x="960" y="554" class="grp">CONSUMIDOR EXTERNO</text>
  <rect x="960" y="448" width="240" height="84" rx="10" fill="#f8f4ea" stroke="#8f7d5a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="t" x="980" y="478">Navegador</text>
  <text class="d" x="980" y="504">painel web em Next.js</text>

  <text class="mt" x="60" y="600">Protobuf é o formato binário usado em todas as ligações de rede, menos HTTP.</text>
</svg>
